# Local, reproducible stack: PostgreSQL 16 + Django API (gunicorn) + React SPA (nginx).
#   cp .env.example .env    # then set DJANGO_SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up --build -d
#   docker compose exec backend python manage.py seed_demo      # optional synthetic demo data
#   open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantops}
      POSTGRES_USER: ${POSTGRES_USER:-plantops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"   # local-only, for Power BI Desktop / psql

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
      - media:/app/media

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "${PLANTOPS_HTTP_PORT:-8080}:80"
    volumes:
      - static:/srv/static:ro

volumes:
  pgdata:
  static:
  media:
